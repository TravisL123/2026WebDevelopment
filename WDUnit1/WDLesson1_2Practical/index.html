<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
  <body>
    <!-- Example of an image from external source
        <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png">
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
    <h1> External Source Images </h1>
    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
    <img src="https://4kwallpapers.com/images/wallpapers/marvels-spider-man--26997.jpg" Height = "500" Width = "500">
    <!-- Challenge 3: Add three more of the same image.  Change the width and height of each image to 
     be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
    <img src="https://4kwallpapers.com/images/wallpapers/marvels-spider-man--26997.jpg" Height = "200" Width = "200">
    <img src="https://4kwallpapers.com/images/wallpapers/marvels-spider-man--26997.jpg" Height = "100" Width = "100">
  <hr>
  <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png">
  -->
  <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
    <h1> Internal Sources Images </h1>
  <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
    <img src="HulkLogo2.jpg">
  <hr>
  <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png">
  -->  

  <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
    <h1>Internal Source Images Inside Folders </h1>
  <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. 
                   Both images are located in the images folder to the page -->
    <img src= "images/HulkSmash2.png">
    <img src= "images/HulkSmash3.jpg">
  <hr>
  <!-- Challenge Bonus: Create a heading with "Marvel Superheroes".  Add a horizontal rule.  
   Add five images of Marvel Superheroes.  Make them all the same size -->
   <hr>
   <img src="https://substackcdn.com/image/fetch/$s_!nAKQ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F14e6e579-70be-4138-b1a3-70a6ff7722c0_880x1150.jpeg" Height = "500" Width = "500">
   <img src="https://static.wikia.nocookie.net/marveldatabase/images/f/fe/Avengers_Endgame_poster_041_Variant_Textless.jpg/revision/latest?cb=20190629185509" Height = "500" Width = "500">
   <img src="https://images.trutv.com/tru/$dyna_params/https%3A%2F%2Fi.cdn.trutv.com%2Fassets%2Ftru%2Fprod%2Fimages%2F2021%2F01%2FDoctor-Strange-1024x1536.jpg" Height = "500" Width = "500">
   <img src="https://cdn.britannica.com/30/182830-050-96F2ED76/Chris-Evans-title-character-Joe-Johnston-Captain.jpg" Height = "500" Width = "500">
   <img src="https://i.ytimg.com/vi/_i5w37ImpXY/oardefault.jpg?sqp=-oaymwEiCNAFENAFSFqQAgHyq4qpAxEIARUAAAAAJQAAyEI9AICiQw==&rs=AOn4CLB3BqlH_Yv8HVo7vyJV8DbCPp256w&usqp=CCk" Height = "500" Width = "500">

  </body>
</html>
